<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼즐 모음</title>
<style>
  :root {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --tile: #2f2a24;
    --tile-text: #f4f3ef;
    --accent: #c1502e;
    --accent-soft: #f0d9cf;
    --muted: #8a8378;
    --border: #e4e1d8;
    --shadow: 0 8px 24px rgba(47, 42, 36, 0.10);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--tile);
    padding: 40px 20px;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 24px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
    text-decoration: none;
    color: var(--tile);
    box-shadow: var(--shadow);
    transition: transform 0.1s ease;
  }
  .card:active { transform: scale(0.98); }
  .icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--tile);
    color: var(--tile-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .info h2 {
    font-size: 15px;
    margin: 0 0 2px;
  }
  .info p {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>퍼즐 모음</h1>
    <p class="sub">원하는 버전을 눌러서 바로 플레이하세요.</p>

    <a class="card" href="index.html">
      <div class="icon">15</div>
      <div class="info">
        <h2>숫자 15 퍼즐</h2>
        <p>1~15 숫자, 기본 버전</p>
      </div>
    </a>

    <a class="card" href="sliding-puzzle-hangul.html">
      <div class="icon">♥</div>
      <div class="info">
        <h2>하트 & 자음 퍼즐</h2>
        <p>♥ + ㄱ~ㅎ 14개</p>
      </div>
    </a>

    <a class="card" href="sliding-puzzle-alphabet25.html">
      <div class="icon">A</div>
      <div class="info">
        <h2>알파벳 대문자 25</h2>
        <p>A~W + XYZ 한 타일, 5x5</p>
      </div>
    </a>

    <a class="card" href="sliding-puzzle-alphabet25-lower.html">
      <div class="icon">a</div>
      <div class="info">
        <h2>알파벳 소문자 25</h2>
        <p>a~w + xyz 한 타일, 5x5</p>
      </div>
    </a>

    <a class="card" href="sliding-puzzle-korean-vowel.html">
      <div class="icon">모</div>
      <div class="info">
        <h2>한글 모음 & 대한민국 사랑</h2>
        <p>ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ + 대한민국 + ♥</p>
      </div>
    </a>
  </div>
</body>
</html>
